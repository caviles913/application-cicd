name: Application CI/CD - Build and Deploy on Code Change

on:
  push:
    branches:
      - main
      - staging
      - feature/dev

permissions:
  id-token: write
  contents: read      

jobs:
  build-and-deploy:
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/staging' && 'staging') || 'dev' }}
    runs-on: ubuntu-latest  
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Configure AWS credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v5
          with:
            role-to-assume: ${{vars.IAM_ROLE}}
            aws-region: us-east-1
            role-session-name: login-session-by-github-actions
        
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push image to Amazon ECR
          working-directory: api-backend
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
            IMAGE_TAG: latest
          run: |
            #   Build the Docker image
                 docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            # Push the Docker image
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG    
   