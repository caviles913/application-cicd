name: Application CI/CD - Build and Deploy on Code Change

on:
  push:
    branches:
      - main
      - staging
      - feature/dev

permissions:
  id-token: write
  contents: read      

jobs:
  build-and-deploy:
    environment: ${{ (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/staging' && 'staging') || 'dev' }}
    runs-on: ubuntu-latest  
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Configure AWS credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v5
          with:
            role-to-assume: ${{vars.IAM_ROLE}}
            aws-region: us-east-1
            role-session-name: login-session-by-github-actions
        
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Image - Backend .
          working-directory: api-backend/
          run: docker build -t application-backend:0.1 .

        # - name: Tag Image

        # - name: Push Image to ECR
