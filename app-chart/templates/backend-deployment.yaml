apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.appName }}-deployment"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - image: "{{ .Values.image.Repo }}:{{ .Values.image.Tag }}"
        name: {{ .Values.appName }}
        ports:
        - containerPort: {{ .Values.port }}
        env:
        - name: DB_USERNAME
          value: admin
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        - name: DB_ENDPOINT
          value: database-service
        - name: DB_NAME
          value: reviews-db        
