apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.appName }}-deployment"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - image: "{{ .Values.image.Repo }}:{{ .Values.image.Tag }}"
        name: {{ .Values.appName }}
        ports:
        - containerPort: {{ .Values.port }}
        env:
        {{- range .Values.secret.keys }}
          - name: {{ .envName }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.secret.name }}
                key: {{ .secretKey }}
        {{- end }}

  